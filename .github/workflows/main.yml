name: Build Lumi AI APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v5

  - name: Set up Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v4

  - name: Extract project ZIP
    run: |
      set -eu
      ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1 || true)
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No ZIP file found in the repository."
        exit 1
      fi
      mkdir -p extracted-project
      unzip -oq "$ZIP_FILE" -d extracted-project
      echo "Extracted project files:"
      find extracted-project -maxdepth 4 -type f | head -n 100

  - name: Locate Android Gradle project
    run: |
      set -eu
      GRADLEW=$(find extracted-project -type f -name gradlew | head -n 1 || true)
      if [ -n "$GRADLEW" ]; then
        PROJECT_DIR=$(dirname "$GRADLEW")
      else
        SETTINGS=$(find extracted-project -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1 || true)
        if [ -z "$SETTINGS" ]; then
          echo "ERROR: No Gradle wrapper or settings.gradle file was found."
          echo "The ZIP may not contain a complete Android project."
          exit 1
        fi
        PROJECT_DIR=$(dirname "$SETTINGS")
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Android project located at: $PROJECT_DIR"

  - name: Build debug APK
    run: |
      set -eu
      cd "$PROJECT_DIR"
      if [ ! -f gradlew ]; then
        echo "ERROR: Gradle wrapper is missing; cannot build safely."
        exit 1
      fi
      chmod +x gradlew
      ./gradlew assembleDebug --stacktrace

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: lumi-ai-debug-apk
      path: extracted-project/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
