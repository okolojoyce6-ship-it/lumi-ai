name: Build Lumi AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Check and extract Android project
        shell: bash
        run: |
          set -e

          if [ -f "lumi-ai-native-android-project.zip" ]; then
            mkdir -p extracted
            unzip -oq "lumi-ai-native-android-project.zip" -d extracted
          fi

          GRADLEW_PATH=$(find . -type f -name gradlew \
            -not -path './.git/*' | head -n 1 || true)

          SETTINGS_PATH=$(find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path './.git/*' | head -n 1 || true)

          if [ -z "$GRADLEW_PATH" ] || [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: No complete Android Gradle project was found."
            echo "Check that the ZIP contains the Android project and Gradle wrapper."
            exit 1
          fi

          echo "GRADLEW_PATH=$GRADLEW_PATH" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumi-ai-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
