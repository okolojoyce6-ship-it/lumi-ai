name: Build Lumi AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Lumi project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository."
            exit 1
          fi
          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project
          GRADLEW=$(find android-project -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Could not find Gradle wrapper. Check the project ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build Lumi APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Lumi APK
        uses: actions/upload-artifact@v4
        with:
          name: lumi-ai-apk
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
